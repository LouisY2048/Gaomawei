<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decentralized Exchange</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <link rel="stylesheet" href="components/CryptoBackground.css">
    <style>
        :root {
            --primary-color: #3f51b5;
            --secondary-color: #2196F3;
            --success-color: #4CAF50;
            --warning-color: #ff9800;
            --error-color: #f44336;
            --background-color: #f5f7fa;
            --card-background: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #666666;
            --border-radius: 12px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card-background);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 24px;
            font-weight: 600;
        }

        .wallet-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section {
            background: var(--card-background);
            border-radius: var(--border-radius);
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--box-shadow);
        }

        .section h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: var(--transition);
            background: #fff;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background-color: #303f9f;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background-color: #bdbdbd;
            cursor: not-allowed;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .info-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 5px;
        }

        .info-value {
            color: var(--text-primary);
            font-weight: 500;
            font-size: 16px;
        }

        .error {
            color: var(--error-color);
            background-color: rgba(244, 67, 54, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
        }

        .success {
            color: var(--success-color);
            background-color: rgba(76, 175, 80, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
        }

        .info {
            color: var(--secondary-color);
            background-color: rgba(33, 150, 243, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
        }

        .user-switch-btn {
            background-color: var(--secondary-color);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            transition: var(--transition);
            border: none;
        }

        .user-switch-btn:hover {
            background-color: #1976d2;
            transform: translateY(-1px);
        }

        .shared-pool-info {
            color: var(--secondary-color);
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(33, 150, 243, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .pool-share {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .pool-share-bar {
            flex: 1;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }

        .pool-share-fill {
            height: 100%;
            background: var(--secondary-color);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .copy-btn {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .copy-btn:hover {
            background: #1976d2;
        }

        .toggle-btn {
            background: #757575;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        .toggle-btn:hover {
            background: #616161;
        }

        .contract-address-container {
            background: #f8f9fa;
            border: 1px dashed #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .wallet-info {
                flex-direction: column;
                gap: 10px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }

        .market-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .market-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .coin-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .coin-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }
        
        .coin-name {
            font-weight: 600;
            font-size: 16px;
        }
        
        .coin-symbol {
            color: #666;
            font-size: 14px;
            margin-left: 5px;
        }
        
        .price-info {
            text-align: right;
        }
        
        .price-value {
            font-weight: 600;
            font-size: 16px;
        }
        
        .price-change {
            font-size: 14px;
            margin-top: 5px;
        }
        
        .price-up {
            color: var(--success-color);
        }
        
        .price-down {
            color: var(--error-color);
        }
        
        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid var(--secondary-color);
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
        }
        
        .view-more-btn {
            display: block;
            background-color: #f8f9fa;
            color: var(--primary-color);
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        
        .view-more-btn:hover {
            background-color: #e9ecef;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Decentralized Exchange</h1>
            <div class="wallet-info">
                <button id="connectWallet">Connect MetaMask</button>
                <span id="walletAddress"></span>
                <a href="User.html" class="user-switch-btn" target="_blank">Open Another User</a>
                <a href="market.html" class="user-switch-btn" target="_blank">Market Data</a>
            </div>
        </div>

        <div class="section">
            <h2>Add Liquidity</h2>
            <div class="form-group">
                <label>Token0 Amount:</label>
                <input type="number" id="amount0" placeholder="Enter amount" onblur="calculateFromToken0()">
            </div>
            <div class="form-group">
                <label>Token1 Amount:</label>
                <input type="number" id="amount1" placeholder="Enter amount" onblur="calculateFromToken1()">
            </div>
            <button id="addLiquidity">Add Liquidity</button>
            <div id="addLiquidityResult"></div>
        </div>

        <div class="section">
            <h2>Remove Liquidity</h2>
            <div class="form-group">
                <label>LP Token Amount:</label>
                <input type="number" id="removeAmount" placeholder="Enter amount">
            </div>
            <button id="removeLiquidity">Remove Liquidity</button>
            <div id="removeLiquidityResult"></div>
        </div>

        <div class="section">
            <h2>Token Swap</h2>
            <div class="form-group">
                <label>Input Token Amount:</label>
                <input type="number" id="swapAmount" placeholder="Enter amount">
            </div>
            <div class="form-group">
                <label>Select Input Token:</label>
                <select id="tokenIn">
                    <option value="token0">Token0</option>
                    <option value="token1">Token1</option>
                </select>
            </div>
            <button id="swap">Swap</button>
            <div id="swapResult"></div>
        </div>

        <div class="section">
            <h2>Pool Information</h2>
            <div id="poolInfo">Please connect wallet to view pool information</div>
        </div>
        
        <div class="section">
            <h2>Account Information</h2>
            <div id="accountInfo">Please connect wallet to view account information</div>
        </div>

        <div class="section">
            <h2>Market Information</h2>
            <div id="marketInfo" class="info-grid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import initCryptoBackground from './components/CryptoBackground.js';
        
        // 页面加载完成后初始化加密货币背景
        document.addEventListener('DOMContentLoaded', function() {
            initCryptoBackground();
        });
    </script>

    <!-- 添加修复滚动的脚本 -->
    <script type="module" src="components/FixCryptoBackgroundScrolling.js"></script>

    <script>
        // 等待 ethers 加载完成
        window.addEventListener('load', function() {
            if (typeof ethers === 'undefined') {
                console.error('Failed to load ethers library');
                document.getElementById('walletAddress').innerHTML = 
                    '<div class="error">Failed to load ethers library, please refresh the page</div>';
                return;
            }
            
            // 加载市场数据
            fetchSimpleMarketData();
            
            // 其他初始化可以继续进行
            loadContractAddresses().then(() => {
                initializeContracts();
            }).catch(error => {
                console.error('Initialization failed:', error);
                document.getElementById('walletAddress').innerHTML = 
                    `<div class="error">Initialization failed: ${error.message}</div>`;
            });
        });

        // 合约地址和 ABI 需要部署后更新
        let POOL_ADDRESS, TOKEN0_ADDRESS, TOKEN1_ADDRESS;
        
        // 加载合约地址
        async function loadContractAddresses() {
            try {
                const response = await fetch('./contract-addresses.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                const contractAddresses = await response.json();
                POOL_ADDRESS = contractAddresses.pool;
                TOKEN0_ADDRESS = contractAddresses.token0;
                TOKEN1_ADDRESS = contractAddresses.token1;
                
                console.log('已加载合约地址:', {
                    pool: POOL_ADDRESS,
                    token0: TOKEN0_ADDRESS,
                    token1: TOKEN1_ADDRESS
                });
            } catch (error) {
                console.error('Failed to load contract addresses:', error);
                throw error;
            }
        }

        let provider, signer, poolContract, token0Contract, token1Contract;
        let userAddress;

        // 定义 ABI
        const poolABI = [
            {
                "inputs": [
                    {
                        "internalType": "uint256",
                        "name": "amount0",
                        "type": "uint256"
                    }
                ],
                "name": "addLiquidity",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "getReserves",
                "outputs": [
                    {
                        "internalType": "uint256",
                        "name": "",
                        "type": "uint256"
                    },
                    {
                        "internalType": "uint256",
                        "name": "",
                        "type": "uint256"
                    }
                ],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [
                    {
                        "internalType": "uint256",
                        "name": "amount0",
                        "type": "uint256"
                    }
                ],
                "name": "getRequiredAmount1",
                "outputs": [
                    {
                        "internalType": "uint256",
                        "name": "",
                        "type": "uint256"
                    }
                ],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [
                    {
                        "internalType": "uint256",
                        "name": "lpAmount",
                        "type": "uint256"
                    }
                ],
                "name": "removeLiquidity",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [
                    {
                        "internalType": "address",
                        "name": "tokenIn",
                        "type": "address"
                    },
                    {
                        "internalType": "uint256",
                        "name": "amountIn",
                        "type": "uint256"
                    },
                    {
                        "internalType": "address",
                        "name": "tokenOut",
                        "type": "address"
                    }
                ],
                "name": "swap",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [
                    {
                        "internalType": "address",
                        "name": "account",
                        "type": "address"
                    }
                ],
                "name": "balanceOf",
                "outputs": [
                    {
                        "internalType": "uint256",
                        "name": "",
                        "type": "uint256"
                    }
                ],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "totalSupply",
                "outputs": [
                    {
                        "internalType": "uint256",
                        "name": "",
                        "type": "uint256"
                    }
                ],
                "stateMutability": "view",
                "type": "function"
            }
        ];
        
        const tokenABI = [
            {
                "inputs": [
                    {
                        "internalType": "address",
                        "name": "spender",
                        "type": "address"
                    },
                    {
                        "internalType": "uint256",
                        "name": "value",
                        "type": "uint256"
                    }
                ],
                "name": "approve",
                "outputs": [
                    {
                        "internalType": "bool",
                        "name": "",
                        "type": "bool"
                    }
                ],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [
                    {
                        "internalType": "address",
                        "name": "account",
                        "type": "address"
                    }
                ],
                "name": "balanceOf",
                "outputs": [
                    {
                        "internalType": "uint256",
                        "name": "",
                        "type": "uint256"
                    }
                ],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [
                    {
                        "internalType": "address",
                        "name": "owner",
                        "type": "address"
                    },
                    {
                        "internalType": "address",
                        "name": "spender",
                        "type": "address"
                    }
                ],
                "name": "allowance",
                "outputs": [
                    {
                        "internalType": "uint256",
                        "name": "",
                        "type": "uint256"
                    }
                ],
                "stateMutability": "view",
                "type": "function"
            }
        ];

        // Initialize application
        async function initializeApp() {
            try {
                await initializeContracts();
                fetchSimpleMarketData(); // Load market data
            } catch (error) {
                console.error('Failed to initialize application:', error);
            }
        }

        // Connect wallet
        async function connectWallet() {
            try {
                if (typeof window.ethereum !== 'undefined') {
                    console.log('Starting wallet connection...');
                    
                    // Add network change listener
                    window.ethereum.on('chainChanged', () => {
                        console.log('Network has changed, reloading page...');
                        window.location.reload();
                    });
                    
                    // Add account change listener
                    window.ethereum.on('accountsChanged', (accounts) => {
                        console.log('Account has changed, reloading page...');
                        window.location.reload();
                    });
                    
                    // Load contract addresses
                    console.log('Loading contract addresses...');
                    await loadContractAddresses();
                    
                    // Request user authorization
                    console.log('Requesting user authorization...');
                    await window.ethereum.request({ method: 'eth_requestAccounts' });
                    
                    // Check network
                    const network = await window.ethereum.request({ method: 'eth_chainId' });
                    if (network !== '0x7a69') { // 31337 in hex
                        try {
                            await window.ethereum.request({
                                method: 'wallet_switchEthereumChain',
                                params: [{ chainId: '0x7a69' }], // Hardhat local network
                            });
                        } catch (error) {
                            console.error('Failed to switch network:', error);
                            throw new Error('Please switch to Hardhat local network (chainId: 31337)');
                        }
                    }
                    
                    // Create provider
                    console.log('Creating provider...');
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    
                    // Get signer
                    console.log('Getting signer...');
                    signer = provider.getSigner();
                    
                    // Get user address
                    userAddress = await signer.getAddress();
                    console.log('User address:', userAddress);
                    
                    // Display connection success message and user address
                    document.getElementById('walletAddress').innerHTML = 
                        `<div class="success">Wallet Connected: ${userAddress.substring(0, 6)}...${userAddress.substring(38)}</div>`;
                    
                    // Initialize contracts
                    console.log('Initializing contracts...');
                    await initializeContracts();
                    
                    // Add account change notice
                    document.getElementById('walletAddress').innerHTML += 
                        `<div class="info">Multi-user shared pool - You can connect with different accounts</div>`;
                        
                    console.log('Connection successful, current user is in the pool!');
                } else {
                    throw new Error('Please install MetaMask!');
                }
            } catch (error) {
                console.error('Failed to connect wallet:', error);
                document.getElementById('walletAddress').innerHTML = 
                    `<div class="error">Failed to connect wallet: ${error.message}</div>`;
            }

            // Refresh market data
            fetchSimpleMarketData();
        }

        // Initialize contracts
        async function initializeContracts() {
            try {
                console.log('Creating contract instances...');
                
                // Check address validity
                if (!ethers.utils.isAddress(POOL_ADDRESS) || 
                    !ethers.utils.isAddress(TOKEN0_ADDRESS) || 
                    !ethers.utils.isAddress(TOKEN1_ADDRESS)) {
                    throw new Error('Invalid contract address');
                }

                // Use signer instead of provider to create contract instances
                poolContract = new ethers.Contract(POOL_ADDRESS, poolABI, signer);
                token0Contract = new ethers.Contract(TOKEN0_ADDRESS, tokenABI, signer);
                token1Contract = new ethers.Contract(TOKEN1_ADDRESS, tokenABI, signer);
                
                console.log('Contract addresses:', {
                    pool: POOL_ADDRESS,
                    token0: TOKEN0_ADDRESS,
                    token1: TOKEN1_ADDRESS
                });
                
                console.log('Contract instances created');
                
                // Update pool information
                await updatePoolInfo();
            } catch (error) {
                console.error('Failed to initialize contracts:', error);
                throw error;
            }
        }

        // Calculate Token1 amount from Token0
        async function calculateFromToken0() {
            try {
                const amount0Str = document.getElementById('amount0').value;
                
                // Basic input validation
                if (!amount0Str || isNaN(amount0Str) || parseFloat(amount0Str) <= 0) {
                    document.getElementById('amount1').value = '';
                    return;
                }
                
                if (!poolContract) {
                    console.log('Contract not initialized, cannot calculate Token1 amount');
                    return;
                }
                
                const amount0 = ethers.utils.parseEther(amount0Str);
                console.log('Calculating Token1 amount, Token0 input:', amount0Str, '(Wei:', amount0.toString(), ')');
                
                // Call contract's getRequiredAmount1 method
                const requiredAmount1 = await poolContract.getRequiredAmount1(amount0);
                const requiredAmount1Str = ethers.utils.formatEther(requiredAmount1);
                
                console.log('Required Token1 amount:', requiredAmount1Str, '(Wei:', requiredAmount1.toString(), ')');
                
                // Set Token1 input field
                document.getElementById('amount1').value = requiredAmount1Str;
            } catch (error) {
                console.error('Failed to calculate Token1 amount:', error);
            }
        }

        // Calculate Token0 amount from Token1 (requires reverse calculation)
        async function calculateFromToken1() {
            try {
                const amount1Str = document.getElementById('amount1').value;
                
                // Basic input validation
                if (!amount1Str || isNaN(amount1Str) || parseFloat(amount1Str) <= 0) {
                    document.getElementById('amount0').value = '';
                    return;
                }
                
                if (!poolContract) {
                    console.log('Contract not initialized, cannot calculate Token0 amount');
                    return;
                }
                
                const amount1 = ethers.utils.parseEther(amount1Str);
                console.log('Calculating Token0 amount, Token1 input:', amount1Str, '(Wei:', amount1.toString(), ')');
                
                // Get current pool reserves
                const [reserve0, reserve1] = await poolContract.getReserves();
                
                // If pool has no reserves, use initial ratio (token0:token1 = 1:2)
                if (reserve0.isZero() || reserve1.isZero()) {
                    const amount0 = amount1.div(2); // Assume initial ratio is 1:2
                    const amount0Str = ethers.utils.formatEther(amount0);
                    console.log('Pool is empty, using initial ratio 1:2, required Token0 amount:', amount0Str, '(Wei:', amount0.toString(), ')');
                    document.getElementById('amount0').value = amount0Str;
                    return;
                }
                
                // Calculate required Token0 amount based on current pool ratio
                // amount0 = amount1 * reserve0 / reserve1
                const amount0 = amount1.mul(reserve0).div(reserve1);
                const amount0Str = ethers.utils.formatEther(amount0);
                
                console.log('Required Token0 amount:', amount0Str, '(Wei:', amount0.toString(), ')');
                
                // Set Token0 input field
                document.getElementById('amount0').value = amount0Str;
            } catch (error) {
                console.error('Failed to calculate Token0 amount:', error);
            }
        }

        // Calculate Token1 amount (for backward compatibility)
        async function calculateToken1Amount() {
            return calculateFromToken0();
        }

        // Add liquidity
        async function addLiquidity() {
            try {
                console.log('===== Starting Add Liquidity Process =====');
                const amount0Str = document.getElementById('amount0').value;
                const amount1Str = document.getElementById('amount1').value;
                
                // Basic input validation
                if (!amount0Str || isNaN(amount0Str) || parseFloat(amount0Str) <= 0) {
                    throw new Error('Please enter a valid Token0 amount');
                }
                
                if (!amount1Str || isNaN(amount1Str) || parseFloat(amount1Str) <= 0) {
                    throw new Error('Please calculate the required Token1 amount');
                }
                
                const amount0 = ethers.utils.parseEther(amount0Str);
                const amount1 = ethers.utils.parseEther(amount1Str);
                
                console.log('Token0 amount:', amount0Str, '(Wei:', amount0.toString(), ')');
                console.log('Token1 amount:', amount1Str, '(Wei:', amount1.toString(), ')');
                
                // Recalculate once to ensure amounts are correct
                const requiredAmount1 = await poolContract.getRequiredAmount1(amount0);
                
                // If calculated amount1 doesn't match displayed amount, user may have modified input or contract state changed
                if (!requiredAmount1.eq(amount1)) {
                    console.warn('Calculated Token1 amount doesn\'t match displayed amount, updating display');
                    document.getElementById('amount1').value = ethers.utils.formatEther(requiredAmount1);
                    
                    // Update local variable
                    const newAmount1Str = ethers.utils.formatEther(requiredAmount1);
                    console.log('Updated Token1 amount:', newAmount1Str, '(Wei:', requiredAmount1.toString(), ')');
                }

                // Check token balances
                console.log('Checking Token0 balance...');
                const balance0 = await token0Contract.balanceOf(userAddress);
                console.log('Token0 balance:', ethers.utils.formatEther(balance0), '(Wei:', balance0.toString(), ')');
                
                console.log('Checking Token1 balance...');
                const balance1 = await token1Contract.balanceOf(userAddress);
                console.log('Token1 balance:', ethers.utils.formatEther(balance1), '(Wei:', balance1.toString(), ')');

                if (balance0.lt(amount0)) {
                    throw new Error(`Insufficient Token0 balance (Current: ${ethers.utils.formatEther(balance0)} T0, Required: ${amount0Str} T0)`);
                }
                if (balance1.lt(requiredAmount1)) {
                    throw new Error(`Insufficient Token1 balance (Current: ${ethers.utils.formatEther(balance1)} T1, Required: ${ethers.utils.formatEther(requiredAmount1)} T1)`);
                }

                // Check allowances
                console.log('Checking Token0 allowance...');
                const allowance0 = await token0Contract.allowance(userAddress, POOL_ADDRESS);
                console.log('Token0 allowance:', ethers.utils.formatEther(allowance0), '(Wei:', allowance0.toString(), ')');
                
                console.log('Checking Token1 allowance...');
                const allowance1 = await token1Contract.allowance(userAddress, POOL_ADDRESS);
                console.log('Token1 allowance:', ethers.utils.formatEther(allowance1), '(Wei:', allowance1.toString(), ')');

                // Token0 approval
                if (allowance0.lt(amount0)) {
                    console.log('Approving Token0...');
                    document.getElementById('addLiquidityResult').innerHTML = 
                        '<div class="info">Please confirm Token0 approval in MetaMask...</div>';
                    
                    try {
                        const approveTx0 = await token0Contract.approve(POOL_ADDRESS, amount0, {
                            gasLimit: 100000
                        });
                        console.log('Token0 approval transaction sent:', approveTx0.hash);
                        
                        document.getElementById('addLiquidityResult').innerHTML = 
                            '<div class="info">Token0 approval in progress, please wait for confirmation...</div>';
                        
                        const receipt0 = await approveTx0.wait();
                        console.log('Token0 approval confirmed:', receipt0);
                    } catch (approveError) {
                        console.error('Token0 approval failed:', approveError);
                        console.log('Full error object:', JSON.stringify(approveError, (key, value) => 
                            key === 'provider' ? undefined : value, 2));
                        
                        if (approveError.code === 'ACTION_REJECTED') {
                            throw new Error('User rejected Token0 approval');
                        } else {
                            throw new Error(`Token0 approval failed: ${approveError.message || approveError}`);
                        }
                    }
                }

                // Token1 approval
                if (allowance1.lt(requiredAmount1)) {
                    console.log('Approving Token1...');
                    document.getElementById('addLiquidityResult').innerHTML = 
                        '<div class="info">Please confirm Token1 approval in MetaMask...</div>';
                    
                    try {
                        const approveTx1 = await token1Contract.approve(POOL_ADDRESS, requiredAmount1, {
                            gasLimit: 100000
                        });
                        console.log('Token1 approval transaction sent:', approveTx1.hash);
                        
                        document.getElementById('addLiquidityResult').innerHTML = 
                            '<div class="info">Token1 approval in progress, please wait for confirmation...</div>';
                        
                        const receipt1 = await approveTx1.wait();
                        console.log('Token1 approval confirmed:', receipt1);
                    } catch (approveError) {
                        console.error('Token1 approval failed:', approveError);
                        console.log('Full error object:', JSON.stringify(approveError, (key, value) => 
                            key === 'provider' ? undefined : value, 2));
                        
                        if (approveError.code === 'ACTION_REJECTED') {
                            throw new Error('User rejected Token1 approval');
                        } else {
                            throw new Error(`Token1 approval failed: ${approveError.message || approveError}`);
                        }
                    }
                }
                
                // Add liquidity
                console.log('Adding liquidity...');
                document.getElementById('addLiquidityResult').innerHTML = 
                    '<div class="info">Please confirm add liquidity transaction in MetaMask...</div>';
                
                try {
                    console.log('Calling poolContract.addLiquidity:', amount0.toString());
                    console.log('Pool address:', POOL_ADDRESS);
                    console.log('Method call: addLiquidity');
                    console.log('Parameter: amount0 =', amount0.toString());
                    console.log('Required amount1 =', amount1.toString());
                    
                    // Call modified Pool contract, now need to customize addLiquidity method
                    // Since current contract's addLiquidity method doesn't support custom Token1 amount
                    // First need to check if contract supports this call method
                    
                    const reserves = await poolContract.getReserves();
                    console.log('Current pool reserves:', reserves);
                    
                    const tx = await poolContract.addLiquidity(amount0, {
                        gasLimit: 1000000  // Increase gas limit
                    });
                    
                    console.log('Transaction sent:', tx.hash);
                    document.getElementById('addLiquidityResult').innerHTML = 
                        '<div class="info">Transaction sent, waiting for confirmation...</div>';
                    
                    console.log('Waiting for transaction confirmation...');
                    const receipt = await tx.wait();
                    console.log('Transaction confirmed!', receipt);
                    
                    document.getElementById('addLiquidityResult').innerHTML = 
                        '<div class="success">Liquidity added successfully!</div>';
                    
                    // Clear input fields
                    document.getElementById('amount0').value = '';
                    document.getElementById('amount1').value = '';
                    
                    // Update pool information
                    await updatePoolInfo();
                    console.log('===== Add Liquidity Process Completed =====');
                } catch (txError) {
                    console.error('Add liquidity transaction failed:', txError);
                    console.log('Full error object:', JSON.stringify(txError, (key, value) => 
                        key === 'provider' ? undefined : value, 2));
                    
                    let errorMessage = 'Failed to add liquidity';
                    
                    // Parse common errors
                    if (txError.code === 'ACTION_REJECTED') {
                        errorMessage = 'User rejected the transaction';
                    } else if (txError.code === 'INSUFFICIENT_FUNDS') {
                        errorMessage = 'Insufficient funds for gas fee';
                    } else if (txError.code === 'UNPREDICTABLE_GAS_LIMIT') {
                        errorMessage = 'Unable to estimate gas limit, contract call may fail';
                    } else if (txError.message) {
                        errorMessage = `${errorMessage}: ${txError.message}`;
                    }
                    
                    // Check for more detailed error info
                    if (txError.error) {
                        console.log('Transaction error details:', txError.error);
                        if (txError.error.message) {
                            errorMessage = `${errorMessage}: ${txError.error.message}`;
                        }
                        if (txError.error.data) {
                            console.log('Transaction error data:', txError.error.data);
                        }
                    }
                    
                    document.getElementById('addLiquidityResult').innerHTML = 
                        `<div class="error">${errorMessage}</div>`;
                    
                    throw new Error(errorMessage);
                }
            } catch (error) {
                console.error('Add liquidity total error:', error);
                console.log('Error stack:', error.stack);
                
                let errorMessage = error.message || 'Unknown error';
                document.getElementById('addLiquidityResult').innerHTML = 
                    `<div class="error">Failed to add liquidity: ${errorMessage}</div>`;
            }
        }

        // Remove liquidity
        async function removeLiquidity() {
            try {
                const lpAmount = document.getElementById('removeAmount').value;
                if (!lpAmount || lpAmount <= 0) {
                    throw new Error('Please enter a valid LP Token amount');
                }

                const lpAmountWei = ethers.utils.parseEther(lpAmount);
                
                console.log('Starting liquidity removal...');
                console.log('LP Token amount input:', lpAmount);
                console.log('Wei amount converted:', lpAmountWei.toString());
                
                // Check LP Token balance
                const lpBalance = await poolContract.balanceOf(userAddress);
                console.log('Current LP Token balance:', ethers.utils.formatEther(lpBalance));
                
                if (lpBalance.lt(lpAmountWei)) {
                    throw new Error(`Insufficient LP Token balance (Current: ${ethers.utils.formatEther(lpBalance)} LP, Required: ${lpAmount} LP)`);
                }

                // Call contract to remove liquidity
                console.log('Preparing to send transaction...');
                const tx = await poolContract.removeLiquidity(lpAmountWei, {
                    gasLimit: 500000  // Add gas limit
                });
                console.log('Transaction sent:', tx.hash);
                
                document.getElementById('removeLiquidityResult').innerHTML = 
                    '<div class="success">Transaction sent, waiting for confirmation...</div>';
                
                // Wait for transaction confirmation
                console.log('Waiting for transaction confirmation...');
                const receipt = await tx.wait();
                console.log('Transaction confirmed:', receipt);
                
                document.getElementById('removeLiquidityResult').innerHTML = 
                    '<div class="success">Liquidity removed successfully!</div>';
                
                // Update pool information
                await updatePoolInfo();
            } catch (error) {
                console.error('Failed to remove liquidity:', error);
                let errorMessage = error.message;
                
                // Parse common errors
                if (error.code === 'ACTION_REJECTED') {
                    errorMessage = 'User rejected the transaction';
                } else if (error.code === 'INSUFFICIENT_FUNDS') {
                    errorMessage = 'Insufficient funds for gas fee';
                } else if (error.message.includes('user rejected')) {
                    errorMessage = 'User cancelled the transaction';
                }
                
                document.getElementById('removeLiquidityResult').innerHTML = 
                    `<div class="error">Failed to remove liquidity: ${errorMessage}</div>`;
            }
        }

        // Swap tokens
        async function swap() {
            try {
                const amount = ethers.utils.parseEther(document.getElementById('swapAmount').value);
                const tokenIn = document.getElementById('tokenIn').value;
                
                // First approve token
                const tokenContract = tokenIn === 'token0' ? token0Contract : token1Contract;
                await tokenContract.approve(POOL_ADDRESS, amount);
                
                // Execute swap
                const tx = await poolContract.swap(
                    tokenIn === 'token0' ? TOKEN0_ADDRESS : TOKEN1_ADDRESS,
                    amount,
                    tokenIn === 'token0' ? TOKEN1_ADDRESS : TOKEN0_ADDRESS
                );
                await tx.wait();
                
                document.getElementById('swapResult').innerHTML = 
                    '<div class="success">Swap successful!</div>';
                updatePoolInfo();
            } catch (error) {
                console.error(error);
                document.getElementById('swapResult').innerHTML = 
                    '<div class="error">Swap failed</div>';
            }
        }

        // Update pool information
        async function updatePoolInfo() {
            if (!poolContract) {
                document.getElementById('poolInfo').innerHTML = '<div class="error">Not connected to contract</div>';
                return;
            }
            
            try {
                // 获取池子储备
                const [reserve0, reserve1] = await poolContract.getReserves();
                const reserve0Formatted = ethers.utils.formatEther(reserve0);
                const reserve1Formatted = ethers.utils.formatEther(reserve1);
                
                // 获取池子总流动性
                const totalSupply = await poolContract.totalSupply();
                const totalSupplyFormatted = ethers.utils.formatEther(totalSupply);
                
                // 计算当前汇率
                let rate = "N/A";
                if (!reserve0.isZero()) {
                    rate = (parseFloat(reserve1Formatted) / parseFloat(reserve0Formatted)).toFixed(6);
                }
                
                // 格式化输出
                const poolInfoHTML = `
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Token0 Reserve:</div>
                            <div class="info-value">${reserve0Formatted}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Token1 Reserve:</div>
                            <div class="info-value">${reserve1Formatted}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Total Liquidity Tokens:</div>
                            <div class="info-value">${totalSupplyFormatted} LP</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Current Exchange Rate:</div>
                            <div class="info-value">1 Token0 = ${rate} Token1</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Shared Pool:</div>
                            <div class="info-value">
                                <span class="shared-pool-info">
                                    Multi-user Shared Pool - Pool Address: ${POOL_ADDRESS.substring(0,6)}...${POOL_ADDRESS.substring(38)}
                                </span>
                            </div>
                        </div>
                    </div>
                `;
                
                document.getElementById('poolInfo').innerHTML = poolInfoHTML;
            } catch (error) {
                console.error('Failed to get pool information:', error);
                document.getElementById('poolInfo').innerHTML = 
                    `<div class="error">Failed to get pool information: ${error.message}</div>`;
            }
            
            // 同时更新账户信息
            await updateAccountInfo();
        }
        
        // 更新账户信息
        async function updateAccountInfo() {
            if (!poolContract || !token0Contract || !token1Contract || !userAddress) {
                document.getElementById('accountInfo').innerHTML = '<div class="error">Wallet not connected</div>';
                return;
            }
            
            try {
                // 获取代币余额
                const token0Balance = await token0Contract.balanceOf(userAddress);
                const token1Balance = await token1Contract.balanceOf(userAddress);
                const lpBalance = await poolContract.balanceOf(userAddress);
                
                // 格式化余额
                const token0BalanceFormatted = ethers.utils.formatEther(token0Balance);
                const token1BalanceFormatted = ethers.utils.formatEther(token1Balance);
                const lpBalanceFormatted = ethers.utils.formatEther(lpBalance);
                
                // 计算用户在池子中的份额
                let poolShare = "0%";
                let sharePercent = 0;
                const totalSupply = await poolContract.totalSupply();
                if (!totalSupply.isZero()) {
                    sharePercent = (parseFloat(lpBalanceFormatted) / parseFloat(ethers.utils.formatEther(totalSupply)) * 100);
                    poolShare = `${sharePercent.toFixed(2)}%`;
                }
                
                // 格式化输出
                const accountInfoHTML = `
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Account Address:</div>
                            <div class="info-value">${userAddress.substring(0,6)}...${userAddress.substring(38)}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Token0 Balance:</div>
                            <div class="info-value">${token0BalanceFormatted}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Token1 Balance:</div>
                            <div class="info-value">${token1BalanceFormatted}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">LP Token Balance:</div>
                            <div class="info-value">${lpBalanceFormatted} LP</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Pool Share:</div>
                            <div class="info-value">
                                <span class="pool-share">${sharePercent.toFixed(2)}%</span>
                                <div class="pool-share-bar">
                                    <div class="pool-share-fill" style="width: ${Math.min(sharePercent, 100)}%;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                document.getElementById('accountInfo').innerHTML = accountInfoHTML;
            } catch (error) {
                console.error('Failed to get account information:', error);
                document.getElementById('accountInfo').innerHTML = 
                    `<div class="error">Failed to get account information: ${error.message}</div>`;
            }
        }

        // 复制文本到剪贴板
        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(text)
                .then(() => {
                    alert('Copied to clipboard!');
                })
                .catch(err => {
                    console.error('Failed to copy:', err);
                    alert('Failed to copy: ' + err);
                });
        }
        
        // 显示/隐藏合约地址
        function toggleContractAddresses() {
            const container = document.getElementById('contractAddressContainer');
            const btn = document.getElementById('showAddressesBtn');
            
            if (container.style.display === 'none') {
                container.style.display = 'block';
                btn.style.display = 'none';
                
                // 显示合约地址
                document.getElementById('poolContractAddress').textContent = POOL_ADDRESS;
                document.getElementById('token0ContractAddress').textContent = TOKEN0_ADDRESS;
                document.getElementById('token1ContractAddress').textContent = TOKEN1_ADDRESS;
            } else {
                container.style.display = 'none';
                btn.style.display = 'block';
            }
        }

        // 获取市场数据
        async function fetchSimpleMarketData() {
            try {
                document.getElementById('marketInfo').innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>';
                
                // 获取热门加密货币列表
                const response = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bitcoin,ethereum&order=market_cap_desc&per_page=2&page=1&sparkline=false&price_change_percentage=24h');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                const data = await response.json();
                updateSimpleMarketInfo(data);
            } catch (error) {
                console.error('Failed to fetch market data:', error);
                document.getElementById('marketInfo').innerHTML = `<div class="error">Failed to fetch market data: ${error.message}</div>`;
            }
        }

        // 更新简化的市场信息
        function updateSimpleMarketInfo(data) {
            const marketInfoElement = document.getElementById('marketInfo');
            
            let marketInfoHTML = '<div style="display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between; width: 100%;">';
            
            data.forEach(coin => {
                const priceChangeClass = coin.price_change_percentage_24h >= 0 ? 'price-up' : 'price-down';
                const priceChangeSign = coin.price_change_percentage_24h >= 0 ? '+' : '';
                
                marketInfoHTML += `
                    <div class="market-card" style="flex: 1; min-width: 250px;">
                        <div class="coin-info">
                            <img src="${coin.image}" alt="${coin.name}" class="coin-icon">
                            <div>
                                <span class="coin-name">${coin.name}</span>
                                <span class="coin-symbol">${coin.symbol.toUpperCase()}</span>
                            </div>
                        </div>
                        <div class="price-info">
                            <div class="price-value">$${coin.current_price.toLocaleString()}</div>
                            <div class="price-change ${priceChangeClass}">
                                ${priceChangeSign}${coin.price_change_percentage_24h.toFixed(2)}%
                            </div>
                        </div>
                    </div>
                `;
            });
            
            marketInfoHTML += `
                <div class="market-card" style="flex: 1; min-width: 250px; display: flex; justify-content: center; align-items: center;">
                    <a href="market.html" class="view-more-btn" style="width: 100%; margin: 0; padding: 20px;">View More Market Data</a>
                </div>
            `;
            
            marketInfoHTML += '</div>';
            
            marketInfoElement.innerHTML = marketInfoHTML;
        }

        // 绑定事件监听器
        document.getElementById('connectWallet').addEventListener('click', connectWallet);
        document.getElementById('addLiquidity').addEventListener('click', addLiquidity);
        document.getElementById('removeLiquidity').addEventListener('click', removeLiquidity);
        document.getElementById('swap').addEventListener('click', swap);
    </script>
